name: Release
# A tag vX.Y on main makes the GitHub release: Docs/RELEASE-X.Y.md is its
# notes, and the SDK as an archive (sources only, no build outputs) is
# attached with its SHA-256.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check, archive and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          python3 tools/gather.py --offline-check
          notes="Docs/RELEASE-${TAG#v}.md"
          test -f "$notes"
          name="GFOpenSDK-${TAG#v}"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" "$TAG"
          git archive --format=zip --prefix="$name/" -o "$name.zip" "$TAG"
          sha256sum "$name.tar.gz" "$name.zip" > "$name.sha256"
          gh release create "$TAG" --title "The Open SDK ${TAG#v}" --notes-file "$notes" "$name.tar.gz" "$name.zip" "$name.sha256"

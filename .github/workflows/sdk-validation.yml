name: SDK and OpenNDK validation
on:
  push:
    paths: ['OpenNDK/**', 'Include/**', 'Include_I/**', 'FD/**', 'SFD/**', 'Lib/**', 'manifest.json', 'tools/**', 'tests/**', '.github/workflows/sdk-validation.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ndk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-m68k-linux-gnu g++-m68k-linux-gnu
      - run: sh OpenNDK/tests/run.sh
      - name: SDK public headers, C and C++
        run: |
          m68k-linux-gnu-gcc -m68040 -IInclude -IOpenNDK/Include_H -Wall -Wextra -Werror -fsyntax-only tests/sdk/headers.c
          m68k-linux-gnu-g++ -x c++ -std=gnu++17 -m68040 -IInclude -IOpenNDK/Include_H -Wall -Wextra -Werror -fsyntax-only tests/sdk/headers.c
      - name: libopensdk.a, a stub for every call in SFD/
        run: PREFIX=m68k-linux-gnu- sh Lib/build.sh
      - run: sh tests/host/run.sh
      - run: python3 -m unittest discover -s tests/sdk -v
      - run: python3 tools/gather.py --offline-check
      - run: python3 -m py_compile tools/build_curl_sdk.py
  aroscompat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generated headers up to date
        run: python3 tools/gen_aroscompat.py --check
      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tc
          curl -fsSL -o build/tc.tar.xz https://github.com/DalsinAI/gfopengcc/releases/download/v16.2.0-open6/gfopenamigagcc-16.2.0-open6-x86_64-linux.tar.xz
          echo '65f284476ec20cdf7851475d91d2c18d77fa6f2a0eb0f844b6ca23dbfa57eaa7  build/tc.tar.xz' | sha256sum -c -
          tar xf build/tc.tar.xz -C build/tc
      - name: libaroscompat.a and AROSHello
        run: CC="$PWD/build/tc/gfopenamigagcc-16.2.0-open6-x86_64-linux/bin/m68k-amigaos-gcc" NDK_INC="$PWD/OpenNDK/Include_H" OUT="$PWD/build/arh" sh Examples/aroscompat-hello/build.sh
      - name: AROSHello on a 68040 (vamos)
        run: |
          pip install amitools==0.8.1 machine68k==0.3.0 greenlet
          cd build/arh
          vamos -C 68040 -m 8192 -H disable ./AROSHello | tee o1.txt
          vamos -C 68040 -m 8192 -H disable ./AROSHello Dale TIMES=3 | tee o2.txt
          grep -q 'hook 1, list 3, LONG2BE 11223344, LONG2LE 44332211, memory ok' o1.txt
          test "$(grep -c 'Hello, Dale' o2.txt)" = 3
          grep -q 'hook 3, list 3' o2.txt
          grep -q 'sets init 1' o1.txt
          grep -q 'sets exit' o1.txt
  curl-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/gfopencurl
          ref: 5776d8375c5d87b7b6c8d5187c3a061567f6bd54
          path: build/curl
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/gfopentls
          ref: 919dd04ff675bee42a5bf0c26393043fd4c78d77
          path: build/tls
      - name: Fetch checksum-pinned inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tc build/tarballs build/deps/include build/deps/lib build/zobj build/stove
          curl -fsSL -o build/tc.tar.xz https://github.com/DalsinAI/gfopengcc/releases/download/v16.2.0-open6/gfopenamigagcc-16.2.0-open6-x86_64-linux.tar.xz
          echo '65f284476ec20cdf7851475d91d2c18d77fa6f2a0eb0f844b6ca23dbfa57eaa7  build/tc.tar.xz' | sha256sum -c -
          tar xf build/tc.tar.xz -C build/tc
          ln -s "$PWD/build/tc/gfopenamigagcc-16.2.0-open6-x86_64-linux" build/stove/prefix
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re,urllib.request
          root=Path('build/stove')
          files={str(p.relative_to(root/'prefix')):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted((root/'prefix').rglob('*')) if p.is_file()}
          (root/'provenance.json').write_text(json.dumps(dict(release='16.2.0-open6',archive_sha256='65f284476ec20cdf7851475d91d2c18d77fa6f2a0eb0f844b6ca23dbfa57eaa7',compiler_runtime_sha256=files)))
          for name,url,sha in re.findall(r'file:\s+(\S+)\s+from:\s+(\S+)\s+sha256:\s+(\S+)',Path('build/curl/SOURCES').read_text()):
              p=Path('build/tarballs')/name
              with urllib.request.urlopen(url,timeout=120) as r:p.write_bytes(r.read())
              assert hashlib.sha256(p.read_bytes()).hexdigest()==sha,name
          PY
      - name: Build target zlib and curl SDK overlay
        shell: bash
        run: |
          set -euo pipefail
          tar xf build/tarballs/zlib-1.3.1.tar.xz -C build
          for f in adler32 crc32 deflate infback inffast inflate inftrees trees zutil compress uncompr gzclose gzlib gzread gzwrite; do
            build/stove/prefix/bin/m68k-amigaos-gcc -m68040 -m68881 -mcrt=nix20 -O2 -DHAVE_UNISTD_H -c "build/zlib-1.3.1/$f.c" -o "build/zobj/$f.o"
          done
          build/stove/prefix/bin/m68k-amigaos-ar rcs build/deps/lib/libz.a build/zobj/*.o
          cp build/zlib-1.3.1/zlib.h build/zlib-1.3.1/zconf.h build/deps/include/
          python3 tools/build_curl_sdk.py --stove build/stove --curl-source build/curl --tls-source build/tls --tarballs build/tarballs --dependencies build/deps --out build/overlay --jobs 4
          grep -q 'Features:.*HTTP2' build/overlay/build.log
          grep -q 'Protocols: http https$' build/overlay/build.log
          build/stove/prefix/bin/m68k-amigaos-objdump -f build/overlay/sdk/curltest | grep amiga
      - name: Link a consumer through the relocated CMake package
        shell: bash
        run: |
          set -euo pipefail
          cp -a build/overlay/sdk build/relocated-sdk
          cmake -S tests/sdk/curl_consumer -B build/consumer -DCMAKE_SYSTEM_NAME=Generic -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY -DCMAKE_C_COMPILER="$PWD/build/stove/prefix/bin/m68k-amigaos-gcc" -DCMAKE_C_FLAGS="-m68040 -m68881 -mcrt=nix20 -pthread" -DCURL_DIR="$PWD/build/relocated-sdk/lib/cmake/CURL"
          cmake --build build/consumer
          build/stove/prefix/bin/m68k-amigaos-objdump -f build/consumer/curl-consumer | grep amiga
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curl-sdk-overlay
          path: |
            build/overlay/sdk
            build/overlay/receipt.json
            build/overlay/build.log
